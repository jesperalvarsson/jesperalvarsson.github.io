<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Receipt Split</title>
<meta name="description" content="Scan or upload a receipt, split every line onto its own card, choose who's paying, and settle up.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e7d52">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Receipt Split">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<style>
:root{
  --paper:#eaf0ec; --card:#ffffff; --surface:#f3f7f4;
  --ink:#15201b; --ink-2:#5a6a61; --ink-3:#95a29a;
  --line:#e2e9e4; --line-2:#cfdbd4;
  --accent:#1e7d52; --accent-ink:#155f3f; --accent-wash:#e3f1ea; --on-accent:#ffffff;
  --good:#5c7269; --good-ink:#43554d; --good-wash:#edf1ef;
  --shadow:0 18px 40px -22px rgba(20,50,35,.35);
  --radius:16px;
}
:root:not([data-theme="light"]){ color-scheme:light; }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0e1512; --card:#17201c; --surface:#131b17;
    --ink:#e9f1eb; --ink-2:#9fb0a6; --ink-3:#6f7f76;
    --line:#26312b; --line-2:#334039;
    --accent:#3fae77; --accent-ink:#8fd6b0; --accent-wash:#183026; --on-accent:#082018;
    --good:#7d938a; --good-ink:#a9bdb2; --good-wash:#1c2621;
    --shadow:0 18px 42px -20px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0e1512; --card:#17201c; --surface:#131b17;
  --ink:#e9f1eb; --ink-2:#9fb0a6; --ink-3:#6f7f76;
  --line:#26312b; --line-2:#334039;
  --accent:#3fae77; --accent-ink:#8fd6b0; --accent-wash:#183026; --on-accent:#082018;
  --good:#7d938a; --good-ink:#a9bdb2; --good-wash:#1c2621;
  --shadow:0 18px 42px -20px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Hanken Grotesk",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
  display:flex; justify-content:center;
}
button{font-family:inherit}

.app{
  width:100%; max-width:500px; min-height:100dvh;
  display:flex; flex-direction:column;
  background:var(--card);
  box-shadow:var(--shadow);
}

/* ---------- masthead ---------- */
.masthead{
  position:relative; background:var(--surface);
  padding:22px 22px 26px; text-align:center;
  border-bottom:1px dashed var(--line-2);
}
.clearall{
  position:absolute; top:14px; right:14px; z-index:2;
  font-family:"Hanken Grotesk",sans-serif; font-size:11.5px; font-weight:600;
  color:var(--ink-2); background:var(--card); border:1px solid var(--line);
  padding:6px 11px; border-radius:20px; cursor:pointer; transition:.15s;
}
.clearall:hover{color:var(--accent); border-color:var(--accent)}
.clearall:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.brand{
  font-family:"Spline Sans Mono",monospace;
  font-size:11px; letter-spacing:.28em; text-transform:uppercase;
  color:var(--accent); font-weight:600; margin-bottom:12px;
}
.place{
  font-family:"Fraunces",Georgia,serif; font-weight:600;
  font-size:23px; line-height:1.15; text-wrap:balance; margin:0;
}
.meta{
  margin-top:7px; font-family:"Spline Sans Mono",monospace;
  font-size:12px; color:var(--ink-2); letter-spacing:.02em;
}
.masthead::after{
  content:""; position:absolute; left:0; right:0; bottom:-8px; height:8px;
  background:radial-gradient(circle at 8px -2px, transparent 6px, var(--surface) 6.5px) 0 0/16px 8px repeat-x;
}

/* ---------- list ---------- */
.list{
  flex:1; padding:14px 14px 8px; display:flex; flex-direction:column; gap:9px;
  overflow:visible;
}
.divider{
  display:flex; align-items:center; gap:10px;
  margin:8px 4px 2px; font-family:"Spline Sans Mono",monospace;
  font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-3);
}
.divider::before,.divider::after{content:"";height:1px;flex:1;background:var(--line)}

.card{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  padding:11px 12px 11px 15px; border-radius:var(--radius);
  background:var(--card); border:1.5px solid var(--line);
  color:inherit; cursor:pointer;
  transition:border-color .18s, background .18s, box-shadow .18s, transform .1s;
}
.card:hover:not(.paid){border-color:var(--line-2)}
.card:active:not(.paid){transform:scale(.99)}
.card:focus-visible{outline:2.5px solid var(--accent); outline-offset:2px}

.tick{
  flex:none; width:24px; height:24px; border-radius:8px;
  border:1.5px solid var(--line-2); background:var(--surface);
  display:grid; place-items:center; transition:.16s;
}
.tick svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.5);transition:.16s}

.body{flex:1; min-width:0}
.name{font-size:14.5px; font-weight:600; line-height:1.25}
.tags{display:flex; gap:6px; margin-top:5px; flex-wrap:wrap}
.chip{
  font-family:"Spline Sans Mono",monospace; font-size:10px; font-weight:500;
  letter-spacing:.04em; padding:2px 7px; border-radius:20px;
  background:var(--surface); color:var(--ink-2); border:1px solid var(--line);
}
.chip.split{background:var(--accent-wash); color:var(--accent-ink); border-color:transparent}

.price{
  font-family:"Spline Sans Mono",monospace; font-weight:600; font-size:15px;
  font-variant-numeric:tabular-nums; white-space:nowrap;
}

.rowactions{display:flex; gap:1px; flex:none}
.iconbtn{
  width:30px; height:30px; display:grid; place-items:center;
  border:none; background:transparent; color:var(--ink-3);
  border-radius:8px; cursor:pointer; transition:.14s;
}
.iconbtn:hover{background:var(--surface); color:var(--ink)}
.iconbtn.del:hover{color:var(--accent)}
.iconbtn svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.iconbtn:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

.card.sel{border-color:var(--accent); background:var(--accent-wash)}
.card.sel .tick{background:var(--accent); border-color:var(--accent)}
.card.sel .tick svg{opacity:1;transform:scale(1)}

.card.paid{
  cursor:default; background:var(--surface); border-color:var(--line);
  opacity:.72; position:relative; padding-right:15px;
}
.card.paid .name{color:var(--ink-2); text-decoration:line-through; text-decoration-color:var(--ink-3)}
.card.paid .price{color:var(--ink-3)}
.card.paid .tick{background:var(--good); border-color:var(--good)}
.card.paid .tick svg{opacity:1;transform:scale(1)}
.stamp{
  flex:none; font-family:"Spline Sans Mono",monospace; font-size:9.5px; font-weight:600;
  letter-spacing:.14em; color:var(--good-ink); background:var(--good-wash);
  border:1px solid var(--good); border-radius:6px; padding:3px 7px;
  transform:rotate(-4deg);
}

.empty{
  text-align:center; color:var(--ink-2); padding:44px 22px;
  font-size:14.5px; line-height:1.6;
  display:flex; flex-direction:column; align-items:center; gap:14px;
}
.empty .eicon{
  width:58px;height:58px;border-radius:16px;background:var(--surface);
  border:1.5px dashed var(--line-2); display:grid;place-items:center;
}
.empty .eicon svg{width:27px;height:27px;stroke:var(--ink-3);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.empty p{margin:0}
.empty strong{color:var(--ink); font-weight:600}
.linkbtn{
  background:none;border:none;color:var(--accent);font:inherit;font-weight:600;
  font-size:13.5px;cursor:pointer;padding:6px 4px;border-radius:8px;
}
.linkbtn:hover{text-decoration:underline}
.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- add bar ---------- */
.addbar{display:flex; gap:8px; padding:6px 14px 12px}
.addbtn{
  flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 10px; border-radius:12px; cursor:pointer;
  background:var(--card); border:1.5px dashed var(--line-2); color:var(--ink);
  font-size:13.5px; font-weight:600; transition:.16s;
}
.addbtn:hover{border-color:var(--accent); color:var(--accent)}
.addbtn svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- settle bar ---------- */
.settle{
  position:sticky; bottom:0; z-index:5;
  display:flex; align-items:center; gap:12px;
  padding:15px 18px calc(15px + env(safe-area-inset-bottom));
  background:var(--surface); border-top:1px solid var(--line);
  box-shadow:0 -14px 30px -24px rgba(20,50,35,.5);
}
.totals{flex:1; min-width:0}
.tlbl{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-2); font-weight:600}
.tamt{
  font-family:"Spline Sans Mono",monospace; font-weight:600;
  font-size:27px; line-height:1.1; margin-top:2px; font-variant-numeric:tabular-nums;
  transition:color .2s;
}
.tsub{font-size:11.5px; color:var(--ink-3); margin-top:3px; font-variant-numeric:tabular-nums}
.curr{
  appearance:none; -webkit-appearance:none;
  font-family:"Spline Sans Mono",monospace; font-weight:600; font-size:13px;
  padding:11px 30px 11px 13px; border-radius:11px; cursor:pointer;
  background:var(--card); color:var(--ink); border:1.5px solid var(--line);
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
  background-position:calc(100% - 16px) center,calc(100% - 11px) center;
  background-size:5px 5px,5px 5px; background-repeat:no-repeat;
}
.pay{
  padding:13px 20px; border-radius:12px; cursor:pointer; white-space:nowrap;
  background:var(--accent); color:var(--on-accent); border:none;
  font-size:14.5px; font-weight:700; letter-spacing:.01em;
  box-shadow:0 8px 18px -8px var(--accent); transition:.16s;
}
.pay:hover:not(:disabled){filter:brightness(1.05)}
.pay:active:not(:disabled){transform:translateY(1px)}
.pay:disabled{background:var(--line-2); color:var(--ink-3); box-shadow:none; cursor:not-allowed}

/* ---------- toast ---------- */
.toast{
  position:fixed; left:50%; bottom:96px; transform:translateX(-50%);
  max-width:88vw; z-index:40;
  display:flex; align-items:center; gap:11px;
  background:var(--ink); color:var(--paper);
  padding:12px 18px; border-radius:12px; font-size:13.5px; font-weight:500; line-height:1.4;
  box-shadow:0 14px 34px -12px rgba(0,0,0,.5);
}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- finished ---------- */
.finished{
  position:fixed; inset:0; z-index:60; display:grid; place-items:center;
  background:rgba(10,25,18,.45); backdrop-filter:blur(3px);
  animation:fade .25s ease;
}
.fcard{
  background:var(--card); color:var(--ink); text-align:center;
  padding:34px 44px; border-radius:22px; box-shadow:0 30px 70px -20px rgba(0,0,0,.5);
  animation:pop .4s cubic-bezier(.2,1.3,.4,1);
}
.fcheck{
  width:62px;height:62px;border-radius:50%;background:var(--accent-wash);
  display:grid;place-items:center;margin:0 auto 16px;
}
.fcheck svg{width:32px;height:32px;stroke:var(--accent);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ftitle{font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:28px}
.fsub{color:var(--ink-2); font-size:13.5px; margin-top:5px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.85)}}

[hidden]{display:none!important}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important; transition-duration:.001s!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="masthead">
    <button class="clearall" id="clearall" type="button" hidden>Clear all</button>
    <div class="brand">Receipt&nbsp;·&nbsp;Split</div>
    <h1 class="place" id="place">New bill</h1>
    <div class="meta" id="meta">Scan a receipt to get started</div>
  </header>

  <main class="list" id="list"></main>

  <div class="addbar">
    <label class="addbtn">
      <svg viewBox="0 0 24 24"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1-1.6a1 1 0 0 1 .85-.4h6a1 1 0 0 1 .85.4l1 1.6h1.7A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.4"/></svg>
      <span>Camera</span>
      <input type="file" accept="image/*" capture="environment" hidden id="photoCam">
    </label>
    <label class="addbtn">
      <svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><circle cx="8.5" cy="10" r="1.6"/><path d="M4 17l4.5-4.5 3 3 4-4L20 16.5"/></svg>
      <span>Upload image</span>
      <input type="file" accept="image/*" hidden id="photoFile">
    </label>
  </div>

  <footer class="settle">
    <div class="totals">
      <div class="tlbl">Selected</div>
      <div class="tamt" id="total">€0.00</div>
      <div class="tsub" id="progress">nothing settled yet</div>
    </div>
    <select class="curr" id="curr" aria-label="Currency"></select>
    <button class="pay" id="pay" disabled>Payed</button>
  </footer>
</div>

<div class="toast" id="toast" hidden></div>

<div class="finished" id="finished" hidden>
  <div class="fcard">
    <div class="fcheck"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>
    <div class="ftitle">Finished</div>
    <div class="fsub">The whole bill is settled.</div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- currencies (rates relative to EUR) ---------- */
  var CURRENCIES = {
    EUR:{rate:1,    locale:"de-DE"},
    USD:{rate:1.08, locale:"en-US"},
    GBP:{rate:0.85, locale:"en-GB"},
    PLN:{rate:4.30, locale:"pl-PL"},
    SEK:{rate:11.3, locale:"sv-SE"},
    CHF:{rate:0.95, locale:"de-CH"}
  };

  /* ---------- optional demo (generic sample data, no real place) ---------- */
  var DEMO = {
    place:"Demo receipt",
    meta:"Sample data · tap items, then Payed",
    rows:[
      {name:"Flat white",           price:3.80, cls:"A", qty:2},
      {name:"Avocado toast",        price:9.50, cls:"A", qty:1},
      {name:"Buttermilk pancakes",  price:8.00, cls:"A", qty:1},
      {name:"Fresh orange juice",   price:4.50, cls:"A", qty:2},
      {name:"Side salad",           price:5.00, cls:"A", qty:1}
    ]
  };

  /* ---------- state ---------- */
  var state = { place:"", meta:"", currency:"EUR", items:[], payCounter:0, wasAllPaid:false };
  var uid = 0;
  var STORE = "receipt-split-v1";

  /* expand rows into one card per unit (multi-item rows split) */
  function rowsToItems(rows){
    var out = [];
    rows.forEach(function(r){
      var qty = r.qty || 1;
      for(var i=0;i<qty;i++){
        out.push({
          id:++uid, name:r.name, price:r.price, cls:r.cls||"A",
          groupSize:qty, groupIndex:i+1,
          selected:false, paid:false, paidAt:0
        });
      }
    });
    return out;
  }

  function loadDemo(){
    state.place = DEMO.place;
    state.meta  = DEMO.meta;
    state.items = rowsToItems(DEMO.rows);
    state.payCounter = 0; state.wasAllPaid = false;
  }

  function clearAll(){
    state.place=""; state.meta=""; state.items=[];
    state.payCounter=0; state.wasAllPaid=false;
  }

  /* ---------- persistence ---------- */
  function save(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }
  function restore(){
    try{
      var raw = localStorage.getItem(STORE);
      if(!raw) return false;
      var s = JSON.parse(raw);
      if(!s || !Array.isArray(s.items)) return false;
      state = s;
      state.items.forEach(function(it){ if(it.id>uid) uid = it.id; });
      if(!CURRENCIES[state.currency]) state.currency = "EUR";
      return true;
    }catch(e){ return false; }
  }

  /* ---------- money ---------- */
  function fmt(eur){
    var c = CURRENCIES[state.currency];
    try{
      return new Intl.NumberFormat(c.locale,{style:"currency",currency:state.currency}).format(eur*c.rate);
    }catch(e){
      return (eur*c.rate).toFixed(2)+" "+state.currency;
    }
  }

  /* ---------- DOM refs ---------- */
  var $ = function(id){ return document.getElementById(id); };
  var listEl=$("list"), totalEl=$("total"), progEl=$("progress"),
      payBtn=$("pay"), currSel=$("curr"), placeEl=$("place"), metaEl=$("meta"),
      toastEl=$("toast"), finishedEl=$("finished"), clearBtn=$("clearall");

  Object.keys(CURRENCIES).forEach(function(code){
    var o=document.createElement("option"); o.value=code; o.textContent=code; currSel.appendChild(o);
  });

  var checkSVG = '<svg viewBox="0 0 24 24"><path d="M5 12l4 4L19 7"/></svg>';
  var editSVG  = '<svg viewBox="0 0 24 24"><path d="M4 20h4L18.5 9.5a2.12 2.12 0 0 0-3-3L5 17v3z"/><path d="M13.5 6.5l3 3"/></svg>';
  var delSVG   = '<svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M6.5 7l.9 12.1a1 1 0 0 0 1 .9h7.2a1 1 0 0 0 1-.9L18.5 7"/></svg>';
  var receiptSVG = '<svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v14.5l-2-1.2-2 1.2-2-1.2-2 1.2-2-1.2-2 1.2V3z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>';

  /* ---------- render with FLIP reordering ---------- */
  function render(){
    if(state.items.length){
      placeEl.textContent = state.place || "Receipt";
      metaEl.textContent  = state.meta || "";
    }else{
      placeEl.textContent = "New bill";
      metaEl.textContent  = "Scan a receipt to get started";
    }
    clearBtn.hidden = state.items.length===0;
    currSel.value = state.currency;

    var reduce = window.matchMedia("(prefers-reduced-motion:reduce)").matches;
    var first = {};
    if(!reduce){
      Array.prototype.forEach.call(listEl.children,function(el){
        if(el.dataset && el.dataset.id) first[el.dataset.id]=el.getBoundingClientRect();
      });
    }

    listEl.innerHTML = "";

    if(state.items.length===0){
      var e=document.createElement("div"); e.className="empty";
      e.innerHTML =
        '<div class="eicon">'+receiptSVG+'</div>'+
        '<p><strong>No receipt yet.</strong><br>Use Camera or Upload image to split a bill by item.</p>'+
        '<button class="linkbtn" id="demo" type="button">Load a demo receipt</button>';
      listEl.appendChild(e);
      var demo=$("demo");
      if(demo) demo.addEventListener("click",function(){ loadDemo(); render(); save(); });
      updateTotals(); return;
    }

    var unpaid = state.items.filter(function(i){return !i.paid;});
    var paid   = state.items.filter(function(i){return i.paid;})
                            .sort(function(a,b){return a.paidAt-b.paidAt;});

    unpaid.forEach(function(it){ listEl.appendChild(cardEl(it)); });
    if(paid.length){
      var d=document.createElement("div"); d.className="divider";
      d.textContent="Settled · "+paid.length;
      listEl.appendChild(d);
      paid.forEach(function(it){ listEl.appendChild(cardEl(it)); });
    }

    if(!reduce){
      Array.prototype.forEach.call(listEl.children,function(el){
        var id = el.dataset && el.dataset.id;
        if(!id || !first[id]) return;
        var last = el.getBoundingClientRect();
        var dx = first[id].left-last.left, dy = first[id].top-last.top;
        if(!dx && !dy) return;
        el.style.transform = "translate("+dx+"px,"+dy+"px)";
        el.style.transition = "none";
        requestAnimationFrame(function(){
          el.style.transition = "transform .42s cubic-bezier(.2,.8,.2,1)";
          el.style.transform = "";
        });
      });
    }

    updateTotals();
  }

  function cardEl(it){
    var b=document.createElement("div");
    b.className="card"+(it.selected?" sel":"")+(it.paid?" paid":"");
    b.dataset.id=it.id;
    if(!it.paid){
      b.tabIndex=0; b.setAttribute("role","button");
      b.setAttribute("aria-pressed", it.selected?"true":"false");
    }

    var tags="";
    if(it.groupSize>1) tags+='<span class="chip split">'+it.groupIndex+" of "+it.groupSize+"</span>";
    if(it.cls==="E")   tags+='<span class="chip">deposit</span>';

    b.innerHTML =
      '<span class="tick">'+checkSVG+'</span>'+
      '<span class="body"><span class="name">'+esc(it.name)+'</span>'+
        (tags?'<span class="tags">'+tags+'</span>':'')+'</span>'+
      (it.paid?'<span class="stamp">PAID</span>':'')+
      '<span class="price">'+fmt(it.price)+'</span>'+
      (it.paid?'':'<span class="rowactions">'+
         '<button class="iconbtn edit" type="button" aria-label="Edit name and price">'+editSVG+'</button>'+
         '<button class="iconbtn del" type="button" aria-label="Remove item">'+delSVG+'</button>'+
       '</span>');

    if(!it.paid){
      var toggle=function(){
        it.selected=!it.selected;
        b.classList.toggle("sel",it.selected);
        b.setAttribute("aria-pressed", it.selected?"true":"false");
        updateTotals(); save();
      };
      b.addEventListener("click",function(ev){
        if(ev.target.closest(".rowactions")) return;
        toggle();
      });
      b.addEventListener("keydown",function(ev){
        if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); toggle(); }
      });
      b.querySelector(".edit").addEventListener("click",function(ev){ ev.stopPropagation(); editItem(it); });
      b.querySelector(".del").addEventListener("click",function(ev){ ev.stopPropagation(); removeItem(it); });
    }
    return b;
  }

  function editItem(it){
    var name = window.prompt("Item name", it.name);
    if(name===null) return;
    var priceStr = window.prompt("Price in EUR (e.g. 16.00)", it.price.toFixed(2));
    it.name = (name.trim() || it.name);
    if(priceStr!==null){
      var p = parseFloat(priceStr.replace(",","."));
      if(!isNaN(p) && p>=0) it.price = p;
    }
    render(); save();
  }

  function removeItem(it){
    state.items = state.items.filter(function(x){return x.id!==it.id;});
    state.wasAllPaid = state.items.length>0 && state.items.every(function(i){return i.paid;});
    render(); save();
  }

  function updateTotals(){
    var selected = state.items.filter(function(i){return i.selected && !i.paid;});
    var sum = selected.reduce(function(a,i){return a+i.price;},0);
    totalEl.textContent = fmt(sum);
    totalEl.style.color = sum>0 ? "var(--accent)" : "var(--ink)";

    var paidCount = state.items.filter(function(i){return i.paid;}).length;
    var total = state.items.length;
    if(total===0){ progEl.textContent="nothing to settle"; }
    else if(selected.length){ progEl.textContent = selected.length+" item"+(selected.length>1?"s":"")+" selected · "+paidCount+"/"+total+" settled"; }
    else { progEl.textContent = paidCount+" of "+total+" items settled"; }

    payBtn.disabled = selected.length===0;
  }

  /* ---------- pay ---------- */
  payBtn.addEventListener("click",function(){
    var selected = state.items.filter(function(i){return i.selected && !i.paid;});
    if(!selected.length) return;
    selected.forEach(function(it){ it.paid=true; it.selected=false; it.paidAt=++state.payCounter; });
    render(); save();

    var allPaid = state.items.length>0 && state.items.every(function(i){return i.paid;});
    if(allPaid && !state.wasAllPaid){ showFinished(); }
    state.wasAllPaid = allPaid;
    save();
  });

  function showFinished(){
    finishedEl.hidden=false;
    setTimeout(function(){ finishedEl.hidden=true; }, 2000);
  }

  /* ---------- currency ---------- */
  currSel.addEventListener("change",function(){
    state.currency = currSel.value; render(); save();
  });

  /* ---------- clear all ---------- */
  clearBtn.addEventListener("click",function(){
    if(!state.items.length) return;
    if(window.confirm("Remove all "+state.items.length+" entries?")){ clearAll(); render(); save(); }
  });

  /* ---------- image (camera or file) → OCR → new receipt ---------- */
  var toastTimer;
  function toast(msg,spinning,ms){
    clearTimeout(toastTimer);
    toastEl.innerHTML = (spinning?'<span class="spin"></span>':'')+esc(msg);
    toastEl.hidden=false;
    if(ms) toastTimer=setTimeout(function(){toastEl.hidden=true;},ms);
  }

  // Enhance the photo before OCR: scale up, grayscale, then Bradley adaptive
  // threshold to binarise. Thermal receipts read far better this way.
  function preprocess(file){
    return new Promise(function(resolve,reject){
      var img=new Image();
      var url=URL.createObjectURL(file);
      img.onload=function(){
        URL.revokeObjectURL(url);
        try{
          var scale=Math.min(1600/Math.max(img.width,img.height), 2);
          if(!isFinite(scale)||scale<=0) scale=1;
          var w=Math.max(1,Math.round(img.width*scale));
          var h=Math.max(1,Math.round(img.height*scale));
          var cv=document.createElement("canvas"); cv.width=w; cv.height=h;
          var ctx=cv.getContext("2d");
          ctx.drawImage(img,0,0,w,h);
          var id=ctx.getImageData(0,0,w,h), d=id.data;
          var gray=new Float32Array(w*h);
          for(var i=0,p=0;i<d.length;i+=4,p++) gray[p]=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
          var IW=w+1, integ=new Float64Array(IW*(h+1));
          for(var y=0;y<h;y++){
            var run=0;
            for(var x=0;x<w;x++){ run+=gray[y*w+x]; integ[(y+1)*IW+(x+1)]=integ[y*IW+(x+1)]+run; }
          }
          var half=Math.max(6, Math.floor(w/28)), Tp=0.85;
          for(var yy=0;yy<h;yy++){
            var y1=yy-half<0?0:yy-half, y2=yy+half>h-1?h-1:yy+half;
            for(var xx=0;xx<w;xx++){
              var x1=xx-half<0?0:xx-half, x2=xx+half>w-1?w-1:xx+half;
              var cnt=(x2-x1+1)*(y2-y1+1);
              var sum=integ[(y2+1)*IW+(x2+1)]-integ[y1*IW+(x2+1)]-integ[(y2+1)*IW+x1]+integ[y1*IW+x1];
              var idx=(yy*w+xx)*4;
              var c=(gray[yy*w+xx]*cnt < sum*Tp)?0:255;
              d[idx]=d[idx+1]=d[idx+2]=c;
            }
          }
          ctx.putImageData(id,0,0);
          resolve(cv);
        }catch(err){ resolve(file); }   // fall back to the raw file
      };
      img.onerror=function(){ URL.revokeObjectURL(url); reject(new Error("couldn't open that image")); };
      img.src=url;
    });
  }

  // One reusable OCR worker, tuned for receipts (single block, spacing kept).
  var _worker=null;
  function getWorker(){
    if(_worker) return _worker;
    _worker = Tesseract.createWorker("eng+lit", 1, {
      logger:function(m){
        if(m.status==="recognizing text"){
          toast("Reading receipt… "+Math.round(m.progress*100)+"%",true);
        }else if(/traineddata|loading language/i.test(m.status||"")){
          toast("Downloading language model… (first scan only)",true);
        }
      }
    }).then(function(w){
      return w.setParameters({ tessedit_pageseg_mode:"6", preserve_interword_spaces:"1" })
              .then(function(){ return w; });
    });
    return _worker;
  }

  function handleImage(file){
    if(!file) return;
    if(typeof Tesseract==="undefined"){
      toast("Photo scanning needs the live app — the preview sandbox blocks it.",false,4600);
      return;
    }
    toast("Enhancing image…",true);
    preprocess(file).then(function(canvas){
      toast("Reading receipt…",true);
      return getWorker().then(function(w){ return w.recognize(canvas); });
    }).then(function(res){
      var rows = parseReceipt((res.data&&res.data.text)||"");
      if(!rows.length){
        toast("Couldn't read any line items — try a sharper, straight-on photo that fills the frame.",false,5200);
        return;
      }
      state.items = rowsToItems(rows);        // start a fresh bill from this receipt
      state.payCounter = 0; state.wasAllPaid = false;
      state.place = "Scanned receipt";
      state.meta  = rows.length+" line"+(rows.length>1?"s":"")+" found · tap ✎ to fix a row";
      render(); save();
      toast("Scanned "+state.items.length+" item"+(state.items.length>1?"s":"")+" — check names & prices, then split.",false,5200);
    }).catch(function(err){
      toast("Scan failed: "+(err&&err.message?err.message:"try another photo"),false,4800);
    });
  }

  function wireInput(id){
    $(id).addEventListener("change",function(e){
      var f = e.target.files && e.target.files[0];
      e.target.value="";
      handleImage(f);
    });
  }
  wireInput("photoCam");
  wireInput("photoFile");

  // Header/footer/total lines that are never menu items.
  var SKIP = /(SUMA|VISO|TARPIN|TOTAL|PVM|MOK[ĖE]JIM|KREDIT|GRYN|KVIT|[ČC][ĖE]KI|S[ĄA]SKAIT|U[ŽZ]SAKYM|STALAS|SVE[ČC]I|KORTEL|GR[ĄA][ŽZ]A|ATSISKAIT|KODAS|SAUGOS|PARA[ŠS]AS|RESTORAN|CAFE|KAVIN|BARAS|\bUAB\b|\bMB\b|\bVMI\b|BAIGTAS|PRAD[ĖE]TAS|PADAV[ĖE]J|NUOLAID|VIENETO|\bVNT\b)/i;

  function toNum(s){ return parseFloat(s.replace(/\s/g,"").replace(",", ".")); }
  function looksLikeName(s){ return /[A-Za-zÀ-ž]{2,}/.test(s); }

  // Handles receipts where the item name and its price are on separate lines:
  // a text-only line is remembered as the name for the next priced line.
  function parseReceipt(text){
    var rows=[], pending="";
    text.split(/\r?\n/).forEach(function(raw){
      var line = raw.replace(/\s+/g," ").trim();
      if(line.length<2) return;
      if(SKIP.test(line)){ pending=""; return; }

      var mult = line.match(/(\d{1,3})\s*[x×]\s*(\d{1,4}[.,]\d{2})/);   // "3x16,00"
      if(mult){
        var qty = parseInt(mult[1],10);
        var each = toNum(mult[2]);
        var nm = cleanName(line.slice(0,mult.index));
        if(nm.length<2) nm = pending;
        if(nm.length<2) nm = "Item";
        if(qty>0 && qty<=50 && each>0 && each<3000){
          rows.push({name:nm, price:each, cls:"A", qty:qty});
          pending="";
        }
        return;
      }

      var prices = line.match(/\d{1,4}[.,]\d{2}/g);
      if(prices){
        var price = toNum(prices[prices.length-1]);
        var idx = line.lastIndexOf(prices[prices.length-1]);
        var nm2 = cleanName(line.slice(0,idx));
        if(nm2.length<2) nm2 = pending;
        if(nm2.length<2) nm2 = "Item";
        if(price>0 && price<3000){
          rows.push({name:nm2, price:price, cls:"A", qty:1});
          pending="";
        }
        return;
      }

      // No price on this line → remember it as the name for the next priced line.
      var cand = cleanName(line);
      if(cand.length>=2 && looksLikeName(cand)) pending = cand;
    });
    return rows;
  }

  function cleanName(s){
    return String(s)
      .replace(/[*•·~_|]+/g," ")          // OCR noise / bullets
      .replace(/\$/g," ")
      .replace(/\s+[A-E]\s*$/,"")          // trailing VAT class letter
      .replace(/^[^0-9A-Za-zÀ-ž]+/,"")     // leading junk
      .replace(/[\-–—:.,\s]+$/,"")         // trailing punctuation
      .replace(/\s{2,}/g," ")
      .trim();
  }

  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

  /* ---------- boot ---------- */
  restore();
  render();
})();
</script>
<script>
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
</script>
</body>
